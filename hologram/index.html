<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ARIA · Proyección</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/hologram.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body class="clean" data-state="idle">
  <!-- Pantalla de proyección: solo el avatar; fondo negro para Pepper's Ghost. -->
  <canvas id="hologram-canvas" aria-label="Proyección de ARIA"></canvas>

  <!-- Interfaz de diagnóstico/voz, oculta en modo limpio. Activar con ?ui=1. -->
  <div id="hud-connection" class="hud" data-status="disconnected" aria-live="polite">
    <span class="dot"></span>
    <span id="connection-text">DESCONECTADO</span>
  </div>
  <div id="hud-state" class="hud"><span id="state-text">IDLE</span></div>
  <div id="hud-message" class="hud" hidden></div>
  <div id="controls" class="hud">
    <button id="btn-listen" type="button" aria-pressed="false">Escuchar: OFF</button>
    <button id="btn-fullscreen" type="button">Pantalla completa</button>
  </div>

  <noscript>ARIA necesita JavaScript para mostrar el avatar.</noscript>

  <script>
    // La proyección queda limpia por defecto. ?ui=1 muestra controles/diagnóstico.
    if (new URLSearchParams(location.search).get("ui") === "1") {
      document.body.classList.remove("clean");
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
