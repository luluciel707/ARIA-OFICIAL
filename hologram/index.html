<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ARIA HOLOGRAM</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/hologram.css">

  <!-- Dependencias de módulos. El navegador solo las descarga cuando un módulo las importa. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body data-state="idle">

  <!-- Escena 3D (Three.js dibujará aquí) -->
  <canvas id="hologram-canvas"></canvas>

  <!-- Estado de conexión con el cerebro -->
  <div id="hud-connection" class="hud" data-status="disconnected">
    <span class="dot"></span>
    <span id="connection-text">DESCONECTADO</span>
  </div>

  <!-- Estado visual de ARIA -->
  <div id="hud-state" class="hud">
    <span id="state-text">IDLE</span>
  </div>

  <!-- Mensajes de carga o error (VRM, micrófono, etc.) -->
  <div id="hud-message" class="hud" hidden></div>

  <!-- Controles (se ocultan en modo montaje con ?clean) -->
  <div id="controls" class="hud">
    <button id="btn-listen" type="button" aria-pressed="false">Escuchar: OFF</button>
    <button id="btn-fullscreen" type="button">Pantalla completa</button>
  </div>

  <!-- Música y videos (YouTube) -->
  <div id="media-panel" hidden>
    <div id="media-bar">
      <span id="media-title">Reproduciendo</span>
      <button id="media-close" type="button" aria-label="Cerrar reproductor">✕</button>
    </div>
    <iframe id="media-frame" title="Reproductor" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <a id="media-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Abrir en YouTube</a>
  </div>

  <noscript>ARIA HOLOGRAM necesita JavaScript activado.</noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
