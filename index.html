<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ARIA</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; --cyan: #22e6ff; --violet: #9b6bff; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    iframe { border: 0; display: block; }

    /* El holograma ocupa toda la pantalla. */
    #hologram { position: fixed; inset: 0; width: 100%; height: 100%; }

    /* El cerebro (chat) es un panel que se abre y se cierra. */
    #brain-panel {
      position: fixed;
      z-index: 20;
      left: calc(12px + env(safe-area-inset-left, 0px));
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      width: min(380px, calc(100vw - 24px));
      height: min(560px, 64vh);
      border: 1px solid color-mix(in srgb, var(--violet) 60%, transparent);
      border-radius: 16px;
      overflow: hidden;
      background: #070914;
      box-shadow: 0 0 40px #8d55ff30;
    }
    #brain-panel[hidden] { display: none; }
    #brain { width: 100%; height: 100%; }

    #toggle-brain {
      position: fixed;
      z-index: 21;
      left: calc(12px + env(safe-area-inset-left, 0px));
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding: 12px 18px;
      font: 600 14px/1 system-ui, sans-serif;
      letter-spacing: 0.04em;
      color: #05030c;
      background: var(--cyan);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Los dos iframes comparten origen, así que se hablan por BroadcastChannel igual que en dos pestañas. -->
  <iframe id="hologram" src="hologram/index.html" title="ARIA holograma"
          allow="microphone; autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>

  <div id="brain-panel" hidden>
    <iframe id="brain" src="brain/index.html" title="ARIA cerebro"></iframe>
  </div>

  <button id="toggle-brain" type="button" aria-expanded="false">Chat</button>

  <script>
    const panel = document.getElementById("brain-panel");
    const button = document.getElementById("toggle-brain");
    const frame = document.getElementById("brain");

    // El cerebro tiene que estar cargado siempre (aunque el panel esté cerrado): hay que
    // dejarlo en el documento. Se oculta con "hidden" y sigue funcionando en segundo plano.
    button.addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      button.setAttribute("aria-expanded", String(!panel.hidden));
      button.textContent = panel.hidden ? "Chat" : "Cerrar chat";
      if (!panel.hidden) frame.contentWindow?.document.getElementById("messageInput")?.focus();
    });
  </script>
</body>
</html>
